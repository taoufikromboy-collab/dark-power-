<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dark Power</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b12;--card:#14141f;--line:#262638;--tx:#ececf5;--mut:#8b8ba3;--ac:#8b5cf6;--ac2:#22d3ee;--r:16px}
[data-theme=light]{--bg:#f4f4fa;--card:#fff;--line:#e0e0ec;--tx:#16161f;--mut:#6b6b82}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,sans-serif;line-height:1.6}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px}
.bar{display:flex;gap:8px;align-items:center;max-width:760px;margin:auto;flex-wrap:wrap}
.logo{margin:0;font-size:1.4rem;font-weight:800}
.logo span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
input,textarea{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;width:100%}
input:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
#search{flex:1;min-width:140px;width:auto}
button{font:inherit;cursor:pointer}
.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.btn{background:linear-gradient(90deg,var(--ac),#6d28d9);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600;display:inline-block}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;max-width:760px;margin:auto;scrollbar-width:none}
.chip{white-space:nowrap;background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:4px 14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:760px;margin:16px auto;padding:0 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.composer .chips{padding-top:0}
.composer textarea{margin:6px 0 10px;resize:vertical}
#fileBox{margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#preview{width:100%}
#preview img{max-width:100%;max-height:220px;border-radius:12px}
#preview audio,.media audio{width:100%}
.progress{height:6px;background:var(--line);border-radius:99px;margin-bottom:10px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .2s}
.muted{color:var(--mut);font-size:.85rem}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.who{font-weight:600}
.badge{font-size:.75rem;color:var(--ac2);border:1px solid var(--line);border-radius:99px;padding:0 8px;margin-inline-start:6px}
.body{white-space:pre-wrap;word-break:break-word;margin:6px 0 10px}
.media img{width:100%;border-radius:12px;display:block}
.media iframe{width:100%;height:420px;border:1px solid var(--line);border-radius:12px;background:#fff}
.file{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.file a,.file button{color:var(--ac2);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:4px 12px;background:transparent}
.acts{display:flex;gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.acts button{background:transparent;border:0;color:var(--mut)}
.acts .liked{color:#f43f5e;font-weight:700}
.comments{margin-top:8px}
.cm{background:var(--bg);border-radius:12px;padding:6px 12px;margin-bottom:6px;font-size:.92rem}
.cm b{color:var(--ac2)}
.cform{display:flex;gap:6px;margin-top:6px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:16px}
.authcard{width:min(100%,380px);display:grid;gap:10px;text-align:center}
.authcard .chips{justify-content:center}
.err{color:#f43f5e;font-size:.9rem;min-height:1.4em}
#banner{background:#f59e0b;color:#000;padding:8px 14px;text-align:center;font-weight:600}
@media(max-width:520px){.logo{font-size:1.15rem}.media iframe{height:320px}}
</style>
</head>
<body>
<div id="banner" hidden></div>

<!-- شاشة الدخول -->
<section id="auth" class="authwrap">
  <form class="card authcard" id="authForm">
    <h1 class="logo">⚡ Dark <span>Power</span></h1>
    <div class="chips">
      <button type="button" class="chip on" data-m="login">دخول</button>
      <button type="button" class="chip" data-m="signup">حساب جديد</button>
    </div>
    <input id="u" dir="ltr" autocomplete="username" placeholder="اسم المستخدم (إنجليزي)">
    <input id="pw" dir="ltr" type="password" autocomplete="current-password" placeholder="كلمة المرور">
    <div id="authErr" class="err"></div>
    <button class="btn" id="authBtn">دخول</button>
    <button type="button" class="ghost themeBtn">🌓 تبديل الوضع</button>
  </form>
</section>

<!-- التطبيق -->
<div id="appRoot" hidden>
  <header class="top">
    <div class="bar">
      <h1 class="logo">⚡ Dark <span>Power</span></h1>
      <input id="search" type="search" placeholder="ابحث في المنشورات…">
      <span class="muted">👤 <b id="nameLbl"></b></span>
      <button class="ghost themeBtn" title="تبديل الوضع">🌓</button>
      <button id="outBtn" class="ghost" title="خروج">🚪</button>
    </div>
    <nav class="chips" id="filters">
      <button class="chip on" data-f="all">الكل</button>
      <button class="chip" data-f="text">📝 نصوص</button>
      <button class="chip" data-f="pdf">📄 PDF</button>
      <button class="chip" data-f="image">🖼️ صور</button>
      <button class="chip" data-f="audio">🎙️ صوت</button>
    </nav>
  </header>
  <main>
    <section class="card composer">
      <div class="chips" id="types">
        <button class="chip on" data-t="text">📝 نص</button>
        <button class="chip" data-t="pdf">📄 PDF</button>
        <button class="chip" data-t="image">🖼️ صورة</button>
        <button class="chip" data-t="audio">🎙️ صوت</button>
      </div>
      <textarea id="text" rows="3" placeholder="اكتب ملاحظتك أو وصفًا للملف…"></textarea>
      <div id="fileBox" hidden>
        <label class="btn ghost" for="file">📎 اختر ملفًا</label>
        <input id="file" type="file" hidden>
        <button id="recBtn" class="btn ghost" hidden>⏺️ تسجيل</button>
        <span id="fileName" class="muted"></span>
        <div id="preview"></div>
      </div>
      <div class="progress" id="prog" hidden><i id="progBar"></i></div>
      <button id="post" class="btn">نشر</button>
    </section>
    <section id="feed"></section>
  </main>
</div>

<script type="module">
/* ====== إعدادات مشروعك الخاصة بـ Firebase ====== */
const firebaseConfig = {
  apiKey: "AIzaSyAnJNZittJqc8f7n82gbQaumYb4Uta3m10",
  authDomain: "dark-power-84f58.firebaseapp.com",
  projectId: "dark-power-84f58",
  storageBucket: "dark-power-84f58.firebasestorage.app",
  messagingSenderId: "92491480228",
  appId: "1:92491480228:web:9dd39b2518409562c5fa31",
  measurementId: "G-98THCFJENJ"
};
/* =============================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };
const banner = t => { const b = $("#banner"); b.textContent = t; b.hidden = false; };

// الثيم (يعمل دائمًا حتى لو فشل Firebase)
document.documentElement.dataset.theme = LS("dp_theme") || "dark";
document.querySelectorAll(".themeBtn").forEach(b => b.onclick = () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t; LS("dp_theme", t);
});

// تحميل Firebase بأمان
let fb = null;
if (firebaseConfig.apiKey === "YOUR_API_KEY") banner("⚠️ لم تضع إعدادات Firebase بعد: عدّل firebaseConfig داخل الملف ثم أعد تحميل الصفحة.");
else try {
  const B = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [A, FS, ST, AU] = await Promise.all(["app", "firestore", "storage", "auth"].map(m => import(`${B}firebase-${m}.js`)));
  const app = A.initializeApp(firebaseConfig);
  fb = { FS, ST, AU, db: FS.getFirestore(app), storage: ST.getStorage(app), auth: AU.getAuth(app) };
} catch (e) { console.error(e); banner("⚠️ تعذر تحميل Firebase. تحقق من اتصال الإنترنت."); }

const { collection, addDoc, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc, arrayUnion, arrayRemove, serverTimestamp } = fb?.FS || {};
const { ref, uploadBytesResumable, getDownloadURL } = fb?.ST || {};
const db = fb?.db, storage = fb?.storage;

// ---- تسجيل الدخول ----
const AUTH_ERR = {
  "auth/email-already-in-use": "اسم المستخدم مأخوذ، اختر اسمًا آخر",
  "auth/invalid-credential": "اسم المستخدم أو كلمة المرور غير صحيحة",
  "auth/user-not-found": "اسم المستخدم أو كلمة المرور غير صحيحة",
  "auth/wrong-password": "اسم المستخدم أو كلمة المرور غير صحيحة",
  "auth/weak-password": "كلمة المرور ضعيفة (6 أحرف على الأقل)",
  "auth/too-many-requests": "محاولات كثيرة، انتظر قليلًا",
  "auth/network-request-failed": "مشكلة في الإنترنت",
  "auth/operation-not-allowed": "فعّل Email/Password في Firebase Authentication"
};
let mode = "login", uid = "", name = "", unsub = null;

document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
  mode = b.dataset.m;
  document.querySelectorAll("[data-m]").forEach(x => x.classList.toggle("on", x === b));
  $("#authBtn").textContent = mode === "login" ? "دخول" : "إنشاء الحساب";
  $("#pw").autocomplete = mode === "login" ? "current-password" : "new-password";
  $("#authErr").textContent = "";
});

$("#authForm").onsubmit = async e => {
  e.preventDefault();
  const err = $("#authErr"); err.textContent = "";
  if (!fb) return err.textContent = "Firebase غير جاهز، راجع الإعدادات.";
  const u = $("#u").value.trim().toLowerCase(), p = $("#pw").value;
  if (!/^[a-z0-9_]{3,20}$/.test(u)) return err.textContent = "اسم المستخدم: 3–20 حرفًا إنجليزيًا أو أرقامًا أو _";
  if (p.length < 6) return err.textContent = "كلمة المرور 6 أحرف على الأقل";
  const { AU, auth } = fb, mail = u + "@darkpower.app";
  $("#authBtn").disabled = true;
  try {
    if (mode === "signup") { const c = await AU.createUserWithEmailAndPassword(auth, mail, p); await AU.updateProfile(c.user, { displayName: u }); }
    else await AU.signInWithEmailAndPassword(auth, mail, p);
  } catch (x) { console.error(x); err.textContent = AUTH_ERR[x.code] || "خطأ: " + (x.code || x.message); }
  $("#authBtn").disabled = false;
};
$("#outBtn").onclick = () => fb?.AU.signOut(fb.auth);

fb?.AU.onAuthStateChanged(fb.auth, user => {
  $("#auth").hidden = !!user; $("#appRoot").hidden = !user;
  if (user) { uid = user.uid; name = user.displayName || user.email.split("@")[0]; $("#nameLbl").textContent = name; listen(); }
  else { unsub?.(); unsub = null; posts = []; uid = ""; $("#pw").value = ""; }
});

// ---- حالة الكتابة ----
let type = "text", file = null, recorder = null, posts = [], filter = "all", term = "";
const ACCEPT = { pdf: "application/pdf", image: "image/*", audio: "audio/*" };
const MAX = 25 * 1024 * 1024;

function setType(t) {
  type = t; file = null; stopRec();
  document.querySelectorAll("#types .chip").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  $("#fileBox").hidden = t === "text";
  $("#recBtn").hidden = t !== "audio";
  $("#file").accept = ACCEPT[t] || "";
  $("#file").value = ""; $("#fileName").textContent = ""; $("#preview").innerHTML = "";
}
$("#types").onclick = e => e.target.dataset.t && setType(e.target.dataset.t);

function setFile(f) {
  if (f.size > MAX) return alert("الحد الأقصى لحجم الملف 25MB");
  file = f; $("#fileName").textContent = f.name;
  const url = URL.createObjectURL(f);
  $("#preview").innerHTML = type === "image" ? `<img src="${url}">` : type === "audio" ? `<audio controls src="${url}"></audio>` : "";
}
$("#file").onchange = e => e.target.files[0] && setFile(e.target.files[0]);

// ---- تسجيل الصوت ----
function stopRec() { if (recorder && recorder.state !== "inactive") recorder.stop(); }
$("#recBtn").onclick = async () => {
  if (recorder && recorder.state === "recording") return recorder.stop();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const mime = recorder.mimeType || "audio/webm", ext = mime.includes("mp4") ? "m4a" : "webm";
      setFile(new File([new Blob(chunks, { type: mime })], `rec-${Date.now()}.${ext}`, { type: mime }));
      $("#recBtn").textContent = "⏺️ تسجيل";
    };
    recorder.start();
    $("#recBtn").textContent = "⏹️ إيقاف";
  } catch { alert("تعذر الوصول إلى الميكروفون (يلزم Live Server أو https)"); }
};

// ---- النشر ----
$("#post").onclick = async () => {
  if (!fb || !uid) return;
  const text = $("#text").value.trim();
  if (type === "text" ? !text : !file) return alert(type === "text" ? "اكتب شيئًا أولًا" : "اختر ملفًا أولًا");
  const btn = $("#post"); btn.disabled = true;
  try {
    let fileUrl = null, fileName = null;
    if (file) {
      const r = ref(storage, `uploads/${type}/${Date.now()}_${file.name.replace(/[^\w.\-]/g, "_")}`);
      $("#prog").hidden = false;
      await new Promise((ok, no) => {
        const t = uploadBytesResumable(r, file);
        t.on("state_changed", s => $("#progBar").style.width = (s.bytesTransferred / s.totalBytes * 100) + "%", no, ok);
      });
      fileUrl = await getDownloadURL(r); fileName = file.name;
    }
    await addDoc(collection(db, "posts"), { type, text, fileUrl, fileName, author: name, uid, likes: [], comments: [], createdAt: serverTimestamp() });
    $("#text").value = ""; setType(type);
  } catch (err) { console.error(err); alert("حدث خطأ أثناء النشر. راجع قواعد Firebase (F12 لمعرفة التفاصيل)."); }
  btn.disabled = false; $("#prog").hidden = true; $("#progBar").style.width = 0;
};

// ---- البحث والتصفية ----
$("#filters").onclick = e => {
  if (!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  document.querySelectorAll("#filters .chip").forEach(b => b.classList.toggle("on", b === e.target));
  render();
};
$("#search").oninput = e => { term = e.target.value.trim().toLowerCase(); render(); };

// ---- العرض ----
const BADGE = { text: "نص", pdf: "PDF", image: "صورة", audio: "صوت" };
const open = new Set();

function card(p) {
  const likes = p.likes || [], cms = p.comments || [];
  const date = p.createdAt?.toDate?.().toLocaleString("ar", { dateStyle: "medium", timeStyle: "short" }) || "الآن";
  let media = "";
  if (p.type === "image") media = `<div class="media"><img loading="lazy" src="${esc(p.fileUrl)}" alt=""></div>`;
  if (p.type === "audio") media = `<div class="media"><audio controls preload="none" src="${esc(p.fileUrl)}"></audio></div>`;
  if (p.type === "pdf") media = `<div class="file">📄 <span>${esc(p.fileName)}</span>
    <button data-a="pdf">👁️ معاينة</button><a href="${esc(p.fileUrl)}" target="_blank" rel="noopener">⬇️ تحميل</a></div><div class="media" data-pv hidden></div>`;
  const liked = likes.includes(uid);
  return `<article class="card" data-id="${p.id}">
    <div class="head"><div><span class="who">${esc(p.author)}</span><span class="badge">${BADGE[p.type]}</span><div class="muted">${date}</div></div>
      ${p.uid === uid ? `<button class="ghost" data-a="del">🗑️</button>` : ""}</div>
    ${p.text ? `<div class="body">${esc(p.text)}</div>` : ""}${media}
    <div class="acts"><button data-a="like" class="${liked ? "liked" : ""}">${liked ? "❤️" : "🤍"} ${likes.length}</button><button data-a="cm">💬 ${cms.length}</button></div>
    <div class="comments" ${open.has(p.id) ? "" : "hidden"}>
      ${cms.map(c => `<div class="cm"><b>${esc(c.author)}</b>: ${esc(c.text)}</div>`).join("")}
      <div class="cform"><input data-ci placeholder="اكتب تعليقًا…" maxlength="500"><button class="btn" data-a="send">إرسال</button></div>
    </div></article>`;
}

function render() {
  const drafts = {};
  document.querySelectorAll("[data-ci]").forEach(i => { if (i.value) drafts[i.closest("article").dataset.id] = i.value; });
  const list = posts.filter(p => (filter === "all" || p.type === filter) && (!term || ((p.text || "") + " " + (p.fileName || "") + " " + p.author).toLowerCase().includes(term)));
  $("#feed").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">لا توجد منشورات بعد ✨</div>`;
  for (const id in drafts) { const i = document.querySelector(`[data-id="${id}"] [data-ci]`); if (i) i.value = drafts[id]; }
}

$("#feed").onclick = e => {
  const a = e.target.closest("[data-a]")?.dataset.a; if (!a) return;
  const art = e.target.closest("article"), id = art.dataset.id, p = posts.find(x => x.id === id), d = doc(db, "posts", id);
  if (a === "like") updateDoc(d, { likes: (p.likes || []).includes(uid) ? arrayRemove(uid) : arrayUnion(uid) });
  if (a === "cm") { open.has(id) ? open.delete(id) : open.add(id); art.querySelector(".comments").hidden = !open.has(id); }
  if (a === "del" && confirm("حذف المنشور؟")) deleteDoc(d);
  if (a === "pdf") {
    const pv = art.querySelector("[data-pv]"); pv.hidden = !pv.hidden;
    pv.innerHTML = pv.hidden ? "" : `<iframe src="https://docs.google.com/gview?embedded=1&url=${encodeURIComponent(p.fileUrl)}"></iframe>`;
  }
  if (a === "send") {
    const inp = art.querySelector("[data-ci]"), t = inp.value.trim(); if (!t) return;
    open.add(id); inp.value = "";
    updateDoc(d, { comments: arrayUnion({ author: name, text: t, ts: Date.now(), uid }) });
  }
};
$("#feed").onkeydown = e => { if (e.key === "Enter" && e.target.matches("[data-ci]")) e.target.nextElementSibling.click(); };

// ---- التحديث الفوري ----
function listen() {
  unsub?.();
  unsub = onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc")),
    s => { posts = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    err => { console.error(err); $("#feed").innerHTML = `<div class="empty">تعذر جلب المنشورات — راجع قواعد Firestore.</div>`; });
}
setType("text");
</script>
</body>
</html>
